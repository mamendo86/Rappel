<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#5C0716">
<link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>Rappel</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--r:#C8102E;--d:#5C0716;--g:#B08A4E;--c:#FAF8F5;--t:#241a1c;--m:#7a6d6f;--l:#e6dfd6}
*{box-sizing:border-box}
body{margin:0;background:var(--c);color:var(--t);font:15px/1.4 Inter,system-ui,sans-serif;padding-bottom:76px}
h1,h2{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0}
header{background:var(--d);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:baseline}
header h1{font-size:21px}header span{color:var(--g);font-size:13px}
main{padding:14px;max-width:640px;margin:auto}
.card{background:#fff;border:1px solid var(--l);border-radius:10px;padding:14px;margin-bottom:12px}
.big{font-family:Fraunces,Georgia,serif;font-size:32px;color:var(--r);margin:2px 0 8px}
.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--l)}
.row:last-child{border:0}.row span{color:var(--m)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td,th{padding:6px 3px;text-align:right;border-bottom:1px solid var(--l)}
td:first-child,th:first-child{text-align:left}th{color:var(--m);font-weight:600}
input,select,button{font:inherit;width:100%;padding:11px;border:1px solid #cfc6bb;border-radius:8px;background:#fff;margin:4px 0 10px}
button{background:var(--r);color:#fff;border:0;font-weight:600}
button.s{background:#fff;color:var(--r);border:1px solid var(--r)}
label{font-size:13px;color:var(--m)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--l);padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:13px 0;color:var(--m);font-weight:600;font-size:11.5px}
nav a.on{color:var(--r);box-shadow:inset 0 3px var(--r)}
.hide{display:none}.seg{display:flex;gap:8px}
.pol{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--l)}
.pol small{color:var(--m);display:block}
.pol.man{background:#fdeeee;border-radius:8px;padding-left:8px;padding-right:6px}
.x{background:none;border:0;color:var(--r);width:auto;padding:10px 12px;margin:0}
.warn{background:#fdecee;color:var(--d);padding:10px;border-radius:8px;margin-bottom:10px;font-size:13px}
.pr{display:grid;grid-template-columns:1.6fr .9fr .8fr 34px 30px;gap:6px;align-items:center}
.pr input,.pr select{margin:2px 0;padding:8px}
button:active{transform:scale(.97);filter:brightness(.92)}
*{-webkit-tap-highlight-color:transparent}button,input,select,nav a{touch-action:manipulation}input,select{font-size:16px}
#toast{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom));background:var(--d);color:#fff;padding:12px 14px;border-radius:10px;display:none;z-index:9;font-size:14px;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 4px 14px #0004}
#toast.on{display:flex}#toast.err{background:#a30d1f}#toast button{width:auto;margin:0;padding:6px 12px;background:#fff;color:var(--d)}
input[type=checkbox]{width:22px;height:22px;margin:0;padding:0;flex:none;accent-color:var(--r)}
.ck{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--l);font-size:14px}
.ck input{margin-top:2px}
summary{padding:10px 0;color:var(--r);font-weight:600;cursor:pointer}
details.card>summary{padding:0}
</style></head>
<body>
<header><h1>Rappel</h1><span id="hy"></span></header>
<main>
<section id="v0"></section><section id="v1" class="hide"></section>
<section id="v2" class="hide"></section><section id="v3" class="hide"></section><section id="v4" class="hide"></section>
</main>
<div id="toast"></div><nav><a data-v="0" class="on">Riepilogo</a><a data-v="1">Polizze</a><a data-v="2">Prodotti</a><a data-v="3">Impostaz.</a><a data-v="4">Provvigioni</a></nav>
<script>
const $=s=>document.querySelector(s),
E=n=>(+n||0).toLocaleString('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0}),
Pc=n=>(+n||0).toFixed(0)+'%',
h=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt()+';'),
MS=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'],
FR={Unico:1,Annuale:1,Semestrale:2,Trimestrale:4,Mensile:12},
SEN=[{n:'≤ 1 anno',is:3450,v:700,d:330},{n:'1-3 anni',is:7700,v:1700,d:790},{n:'3-5 anni',is:8270,v:2000,d:850},{n:'Oltre 5 anni',is:9100,v:2750,d:910}],
AL=[[100,0],[115,.0125],[150,.025],[200,.04],[225,.05],[250,.055],[275,.065],[300,.09],[350,.095],[400,.1],[450,.11],[500,.1125],[600,.115],[1e9,.12]],
VC=[['Risparmio alto valore consulenziale',1.2,0],['Risparmio',1,0],['Previdenza',1,0],['Protezione',4,0],['Investimento alto valore consulenziale',.13,1],['Investimento',.06,1]],
SEED=VC.map(c=>({nome:c[0],tipo:'V',pond:c[1],inv:c[2],cat:c[0],plafP:'',plafR:''}))
 .concat([{nome:'Danni',tipo:'D',pond:3,inv:0,cat:'',plafP:'',plafR:''},{nome:'RC Professionali / PMI GeneraImpresa / CyberLion',tipo:'D',pond:3,inv:0,cat:'',plafP:1000,plafR:''}]);
let S={pol:[],prod:[],imp:{}},ed=null,delId=null,selM=new Date().getMonth();
const CFG=()=>({u:localStorage.rpU||'',k:localStorage.rpK||''});
const api=async(fn,...a)=>{const c=CFG();if(!c.u)throw new Error('Collegamento non configurato');
 const r=await fetch(c.u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,a,k:c.k})});
 const j=await r.json();if(!j.ok)throw new Error(j.e);return j.d};
const aliq=r=>!isFinite(r)||r<100?0:(AL.find(x=>r<=x[0])||AL[13])[1];
const mult=(rd,al)=>rd<100?0:rd<=140?(al>.04?.8:.6):rd<=190?1:rd<=250?1.1:rd<=300?1.15:rd<=350?1.2:1.25;
const I=()=>({anno:+S.imp.anno||new Date().getFullYear(),sen:S.imp.sen!==''&&S.imp.sen!=null&&SEN[+S.imp.sen]?+S.imp.sen:1,apQ:+S.imp.apQ||0,apA:+S.imp.apA||0});
const N=v=>+v||0;
function isPol(p){if(p.isP!==''&&p.isP!=null&&isFinite(+p.isP))return{is:N(p.isP),ra:N(p.isR)+N(p.incNC)+N(p.maggAgg),n:1};
 const i=(p.prata===''||p.prata==null)?N(p.importo):N(p.prata),w=N(p.pond);
 if(p.tipo=='V'){const x=i*w,n=FR[p.fraz]||1;return{is:x,ra:x/n,n}}
 const s=+p.sost||0;let b=i-s,x,r=(i-s+.1*s)*w*(+p.magg?1.1:1);
 if(+p.plafP)b=Math.min(b,+p.plafP);x=b*w;if(+p.plafR)r=Math.min(r,+p.plafR);return{is:x,ra:r,n:1}}
function calc(){const o=I(),sn=SEN[o.sen],y=String(o.anno),
 is=Array(12).fill(0),ra=is.slice(),iv=is.slice(),id=is.slice();
 S.pol.filter(p=>String(p.data).startsWith(y)).forEach(p=>{
  const m=+String(p.data).slice(5,7)-1,c=isPol(p);if(!(m>=0&&m<12))return;is[m]+=c.is;
  if(p.tipo=='V'){if(!+p.inv)iv[m]+=c.is;for(let k=0;k<c.n;k++){const q=m+k*12/c.n;if(q<12)ra[q]+=c.ra}}
  else{id[m]+=c.is;ra[m]+=c.ra}});
 let c=0,cr=0,cv=0,cd=0,paid=0;const out=[];
 for(let m=0;m<12;m++){c+=is[m];cr+=ra[m];cv+=iv[m];cd+=id[m];const k=m+1,
  r=c/(sn.is*k)*100,rv=cv/(sn.v*k)*100,rd=cd/(sn.d*k)*100,al=aliq(r),
  mu=rv>=100&&rd>=100?mult(rd,al):0,mat=cr*al*mu,net=mat>6e4?6e4+(mat-6e4)/2:mat,
  da=Math.max(0,net-paid),pp=paid;if(k%2==0)paid+=da;
  out.push({m,is:is[m],ra:ra[m],c,cr,r,rv,rd,al,mu,mat,net,da,pp})}
 return out}
function show(v){document.querySelectorAll('main section').forEach((s,i)=>s.classList.toggle('hide',i!=v));
 document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.v==v))}
document.querySelectorAll('nav a').forEach(a=>a.onclick=()=>show(a.dataset.v));
const keep=()=>{try{localStorage.rpProd=JSON.stringify(S.prod)}catch(e){}};
function set(r,fresh){S={pol:r.pol||[],prod:r.prod||[],imp:r.imp||{}};
 {const y=new Date().getFullYear(),a=I().anno;selM=a<y?11:a>y?0:(new Date().getMonth()%2?new Date().getMonth():Math.max(0,new Date().getMonth()-1))}
 if(!fresh);else if(S.prod.length)keep();
 else{let L=[];try{L=JSON.parse(localStorage.rpProd||'[]')}catch(e){}
  if(S.imp.seed&&L.length){S.prod=L;enq('saveProdotti',[S.prod],'prod')}
  else if(!S.imp.seed){S.prod=SEED.map(x=>({...x}));S.imp.seed='1';enq('saveProdotti',[S.prod],'prod');enq('saveImp',[{seed:'1'}],'seed')}}
 render()}
function render(){sync();rep();if(!ed&&!IM)lst();prd();imp();pvt();try{localStorage.rpCache=JSON.stringify(S)}catch(e){}}
function rep(){const o=I(),D=calc(),x=D[selM],ap=o.apQ*o.apA/100,sn=SEN[o.sen],bim=(selM+1)%2==0;
 $('#v0').innerHTML=`<label>Situazione a fine</label><select onchange="selM=+this.value;rep()">${MS.map((m,i)=>`<option value="${i}"${i==selM?' selected':''}>${m}</option>`).join('')}</select>
 <div class="card"><label>Rappel da liquidare ${bim?'a questo bimestre':'al prossimo bimestre'}</label><div class="big">${E(x.da+ap)}</div>
 ${x.mu==0?'<div class="warn">Soglia non raggiunta: servono Resa Vita (escl. investimento) e Resa Danni almeno al 100%.</div>':''}
 <div class="row"><span>Rappel maturato (dopo plafond)</span><b>${E(x.net)}</b></div>
 <div class="row"><span>Già liquidato</span><b>${E(x.pp)}</b></div>
 <div class="row"><span>Incentivo anno precedente</span><b>${E(ap)}</b></div></div>
 <div class="card"><h2>Rese e aliquota</h2>
 <div class="row"><span>Resa Indice Sintetico</span><b>${Pc(x.r)}</b></div>
 <div class="row"><span>Resa Vita (escl. inv.)</span><b>${Pc(x.rv)}</b></div>
 <div class="row"><span>Resa Danni</span><b>${Pc(x.rd)}</b></div>
 <div class="row"><span>Aliquota base</span><b>${(x.al*100).toFixed(2)}%</b></div>
 <div class="row"><span>Moltiplicatore Danni</span><b>${Pc(x.mu*100)}</b></div>
 <div class="row"><span>IS di rata progressivo</span><b>${E(x.cr)}</b></div>
 <div class="row"><span>IS progressivo</span><b>${E(x.c)}</b></div></div>
 <div class="card"><h2>Mese per mese</h2><table><tr><th>Mese</th><th>IS</th><th>Rata</th><th>Resa</th><th>Rappel</th></tr>
 ${D.map(d=>`<tr><td>${MS[d.m].slice(0,3)}</td><td>${E(d.is)}</td><td>${E(d.ra)}</td><td>${Pc(d.r)}</td><td>${E(d.net)}</td></tr>`).join('')}</table>
 <p style="font-size:12px;color:var(--m)">Programma mensile IS ${E(sn.is)} · Vita ${E(sn.v)} · Danni ${E(sn.d)}. Le rate Vita frazionate si considerano incassate alle scadenze previste.</p></div>`}
const isImp=p=>p.src=='imp'||!!p.rep;
let lq='',lso='new';
function lsel(){const q=nz(lq).split(' ').filter(Boolean),d=(x,y)=>String(y.data).localeCompare(String(x.data)),m=p=>isImp(p)?1:0;
 const L=S.pol.filter(p=>p.tipo==fv).filter(p=>{if(!q.length)return true;const t=nz([p.cliente,p.polizza,p.prodotto,String(p.data).slice(0,10),p.titolo,p.importo,p.rep].join(' '));return q.every(w=>t.includes(w))});
 const f={new:d,old:(x,y)=>-d(x,y),man:(x,y)=>m(x)-m(y)||d(x,y),imp:(x,y)=>m(y)-m(x)||d(x,y),cli:(x,y)=>nz(x.cliente).localeCompare(nz(y.cliente))||d(x,y)}[lso]||d;
 return L.sort(f)}
function lbody(){const el=$('#pl');if(!el)return;const L=lsel(),tot=S.pol.filter(p=>p.tipo==fv).length;
 el.innerHTML=`${L.length?`<div class="row"><span>${L.length}${L.length<tot?' di '+tot:''} polizze</span><b>IS ${E(L.reduce((a,p)=>a+isPol(p).is,0))}</b></div>`:''}${L.length?L.map(p=>{const c=isPol(p);
 return`<div class="pol${isImp(p)?'':' man'}"><div onclick="frm('${h(p.id)}')" style="flex:1"><b>${h(p.cliente)}</b> · ${h(p.polizza)}<small>${String(p.data).slice(0,10)} · ${p.tipo=='V'?'Vita':'Danni'} · ${h(p.prodotto)}${p.isP!==''&&p.isP!=null?' · da report':''}</small></div>
 <div style="text-align:right"><b>${E(c.is)}</b><small>rata ${E(c.ra)}</small></div><button class="x" onclick="del('${h(p.id)}')"${delId==p.id?' style="background:var(--r);color:#fff;border-radius:8px"':''}>${delId==p.id?'Conferma':'✕'}</button></div>`}).join(''):`<p>${lq?'Nessuna polizza trovata.':'Nessuna polizza. Aggiungi la prima.'}</p>`}`}
function lst(){
 $('#v1').innerHTML=ed?formH():IM?imH():`${seg('fv')}<button onclick="frm()">+ Nuova polizza ${fv=='V'?'Vita':'Danni'}</button><button class="s" onclick="imStart()">Importa da Excel</button>
 <input type="search" id="lq" placeholder="Cerca nome, cognome, n. polizza, prodotto…" value="${h(lq)}" oninput="lq=this.value;lbody()" style="margin-top:10px">
 <select id="lso" onchange="lso=this.value;lbody()">${[['new','Più recenti'],['old','Meno recenti'],['man','Inserite a mano prima'],['imp','Importate prima'],['cli','Cliente A-Z']].map(([k,l])=>`<option value="${k}"${k==lso?' selected':''}>${l}</option>`).join('')}</select>
 <div class="card" id="pl"></div>`;lbody()}
function frm(id){ed=id?{...S.pol.find(p=>p.id==id)}:{tipo:fv,data:new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10),fraz:'Unico',sost:0,magg:0};lst();id?pv():ci()}
function formH(){const t=ed.tipo,pr=S.prod.filter(p=>p.tipo==t),rr=N((S.prod.find(x=>x.nome==ed.prodotto&&x.tipo==t)||{}).rid);
 return`<div class="card"><div class="seg"><button class="${t=='V'?'':'s'}" onclick="ed=rd();ed.tipo='V';ed.prodotto='';ed.prata='';lst();ci()">Vita</button><button class="${t=='D'?'':'s'}" onclick="ed=rd();ed.tipo='D';ed.prodotto='';ed.prata='';lst();ci()">Danni</button></div>
 <label>Data di registrazione a cassa</label><input type="date" id="f_data" value="${String(ed.data).slice(0,10)}">
 <label>N. polizza</label><input id="f_polizza" value="${h(ed.polizza)}">
 <label>Cliente</label><input id="f_cliente" value="${h(ed.cliente)}">
 <label>Prodotto</label><select id="f_prodotto" onchange="ci()">${pr.map(p=>`<option${p.nome==ed.prodotto?' selected':''}>${h(p.nome)}</option>`).join('')}</select>
 <label>${t=='V'?'Premio annuo (o unico)':'Imponibile'} €</label><input type="number" inputmode="decimal" id="f_importo" value="${ed.importo||''}" oninput="ci()">
 <label>Premio di rata € <span id="f_rl">${rr?'(riduzione '+rr+'%)':''}</span></label><input type="number" inputmode="decimal" id="f_prata" value="${ed.prata===''||ed.prata==null?(ed.importo||''):ed.prata}" oninput="pv()">
 ${t=='V'?`<label>Rateizzazione</label><select id="f_fraz" onchange="pv()">${Object.keys(FR).map(k=>`<option${k==ed.fraz?' selected':''}>${k}</option>`).join('')}</select>`:
 `<label>Premio polizza sostituita (riforma), se presente €</label><input type="number" inputmode="decimal" id="f_sost" value="${ed.sost||0}" oninput="pv()">
 <label>Maggiorazione +10% (nuova anagrafica / nuovo bisogno)</label><select id="f_magg" onchange="pv()"><option value="0">No</option><option value="1"${+ed.magg?' selected':''}>Sì</option></select>`}
 <details${ed.isP!==''&&ed.isP!=null?' open':''}><summary>Valori del report Generali</summary>
 <label>IS produzione €</label><input type="number" inputmode="decimal" step="any" id="f_isP" value="${ed.isP==null?'':ed.isP}" oninput="pv()">
 <label>IS di rata €</label><input type="number" inputmode="decimal" step="any" id="f_isR" value="${ed.isR==null?'':ed.isR}" oninput="pv()">
 <label>Incremento IS di rata nuovi clienti / cross-selling €</label><input type="number" inputmode="decimal" step="any" id="f_incNC" value="${ed.incNC==null?'':ed.incNC}" oninput="pv()">
 <label>Maggiorazione IS di rata attività di aggiornamento €</label><input type="number" inputmode="decimal" step="any" id="f_maggAgg" value="${ed.maggAgg==null?'':ed.maggAgg}" oninput="pv()">
 <label>Tipo titolo</label><input id="f_titolo" value="${h(ed.titolo)}">
 <p style="font-size:12px;color:var(--m)">Se "IS produzione" è compilato, i valori del report sostituiscono il calcolo automatico. Svuotalo per tornare al calcolo automatico.</p></details>
 ${t=='D'?`<details${N(ed.durata)?' open':''}><summary>Dati per provvigione (Danni)</summary>
 <label>Durata contratto (mesi)</label><input type="number" inputmode="numeric" id="f_durata" value="${ed.durata||''}">
 <label>Tariffa</label><select id="f_tariffa">${['','Definita','Analitica','Analitica Malattie','GeneraImpresa','Infortuni senza IT'].map(x=>`<option value="${x}"${x==(ed.tariffa||'')?' selected':''}>${x||'Automatica (Definita)'}</option>`).join('')}</select></details>`:''}
 ${t=='V'?`<details${N(ed.durata)||+ed.protOn?' open':''}><summary>Dati per provvigione (Vita)</summary>
 <label>Durata pagamento premi (mesi)</label><input type="number" inputmode="numeric" id="f_durata" value="${ed.durata||''}">
 <label>Tipo</label><select id="f_tipoPU"><option value="">—</option><option${ed.tipoPU=='Produzione di Valore'?' selected':''}>Produzione di Valore</option><option${ed.tipoPU=='Premio Unico'?' selected':''}>Premio Unico</option></select>
 <label class="ck"><input type="checkbox" id="f_protOn"${+ed.protOn?' checked':''}><span>Protection presente (GenerAzione Risparmio)</span></label>
 <label>Quota protection annua € (inclusa nel premio)</label><input type="number" inputmode="decimal" step="any" id="f_prot" value="${ed.prot||''}">
 <label class="ck"><input type="checkbox" id="f_impr"${+ed.impr?' checked':''}><span>Imprevisti Protetti</span></label></details>`:''}
 <div class="row"><span>IS produzione</span><b id="p1"></b></div><div class="row"><span>IS di rata</span><b id="p2"></b></div>
 <button onclick="sv()" style="margin-top:10px">Salva polizza</button><button class="s" onclick="ed=null;lst()">Annulla</button></div>`}
function rd(){const g=i=>{const e=$('#f_'+i);return e?e.value:ed[i]};const o={...ed};
 ['data','polizza','cliente','prodotto','importo','fraz','sost','magg','prata','isP','isR','incNC','maggAgg','titolo','durata','tipoPU','prot','tariffa'].forEach(k=>{if($('#f_'+k))o[k]=g(k)});
 ['protOn','impr'].forEach(k=>{if($('#f_'+k))o[k]=$('#f_'+k).checked?1:0});
 const c=S.prod.find(p=>p.nome==o.prodotto&&p.tipo==o.tipo);if(c){o.pond=c.pond;o.inv=c.inv;o.plafP=c.plafP;o.plafR=c.plafR;o.rid=c.rid}return o}
function ci(){const im=$('#f_importo'),pr=$('#f_prata');if(!im||!pr)return;const s=$('#f_prodotto'),p=S.prod.find(x=>x.nome==(s&&s.value)&&x.tipo==ed.tipo),r=N(p&&p.rid),l=$('#f_rl');
 if(l)l.textContent=r?'(riduzione '+r+'%)':'';pr.value=im.value===''?'':Math.round(N(im.value)*(100-r))/100;pv()}
function pv(){if(!$('#p1'))return;const o=rd(),c=isPol(o);$('#p1').textContent=E(c.is);$('#p2').textContent=E(c.ra)}
function sv(){if(!ed)return;const o=rd();if(!o.prodotto||!+o.importo||!o.data){toast('Compila data, prodotto e importo',1);return}

 const miss=Object.keys(lab).filter(k=>col[k]==null).map(k=>lab[k]);
 if(miss.length)throw new Error('foglio "'+sh.name+'": colonne mancanti ('+miss.join(', ')+')');
 const tipo=/vita/i.test(sh.name)?'V':/danni/i.test(sh.name)?'D':(col.rat!=null?'V':'D');
 let bim='';for(const r of ks){if(r>hr)break;for(const v of Object.values(R[r])){const m=/bimestre:?\s*(\d{2}\.\d{2}\.\d{4})/i.exec(String(v));if(m){bim=m[1];break}}if(bim)break}
 const rows=[],errs=[],sum={pa:0,pr:0,isp:0,isr:0,inc:0,agg:0},tx=v=>String(v==null?'':v).replace(/\s+/g,' ').trim();
 for(const r of ks){if(r<=hr)continue;const c=R[r],g=k=>col[k]==null?undefined:c[col[k]],ps=tx(g('pol'));if(!ps||nz(ps)=='totale')continue;
  const pa=toNum(g('pa')),pr=toNum(g('pr')),ip=toNum(g('isp')),ir=toNum(g('isr')),dt=toIso(g('dat'));
  if(!isFinite(pa)||!isFinite(ip)||!isFinite(ir)||!dt){errs.push('Riga '+r+' ('+ps+'): dati mancanti o non validi, saltata');continue}
  const o={tipo,polizza:ps,cliente:tx(g('cli')),prodotto:tx(g('prod')),bis:tx(g('bis')),data:dt,titolo:tx(g('tit')),fraz:tipo=='V'?frz(g('rat')):'Unico',
   importo:pa,prata:isFinite(pr)?pr:pa,mol:toNum(g('mol'))||0,isP:ip,isR:ir,incNC:toNum(g('inc'))||0,maggAgg:toNum(g('agg'))||0,durata:toNum(g('dur'))||0,tipoPU:tx(g('tpu'))};
  rows.push(o);sum.pa+=o.importo;sum.pr+=o.prata;sum.isp+=o.isP;sum.isr+=o.isR;sum.inc+=o.incNC;sum.agg+=o.maggAgg}
 let tot=null;for(const r of ks){if(Object.values(R[r]).some(v=>nz(v)=='totale')){tot={};for(const k of ['pa','pr','isp','isr','inc','agg'])if(col[k]!=null&&typeof R[r][col[k]]=='number')tot[k]=R[r][col[k]];break}}
 const bad=tot?Object.keys(tot).filter(k=>Math.abs(tot[k]-sum[k])>.05):[];
 return{tipo,name:sh.name,rows,errs,tot,sum,bad,bim}}
// --- confronto con le polizze già inserite (chiave: n. polizza; il n. può ripetersi, quindi si abbina anche per data e premio) ---
function imFields(r,pr){return{tipo:r.tipo,data:r.data,polizza:r.polizza,cliente:r.cliente,prodotto:pr?pr.nome:r.prodotto,importo:r.importo,prata:r.prata,fraz:r.fraz,
 pond:pr?N(pr.pond):r.mol,inv:pr?(+pr.inv?1:0):(r.tipo=='V'&&/investimento/i.test(r.bis||'')?1:0),titolo:r.titolo,isP:r.isP,isR:r.isR,incNC:r.incNC,maggAgg:r.maggAgg,durata:r.durata||0,tipoPU:r.tipoPU||'',rep:r.rep||'',src:'imp'}}
const DK=[['cliente','Cliente','t'],['prodotto','Prodotto','t'],['data','Data','t'],['importo','Premio annuo','n'],['prata','Premio di rata','n'],['isP','IS produzione','n'],['isR','IS di rata','n'],
 ['incNC','Incr. IS rata nuovi clienti','n'],['maggAgg','Magg. IS rata aggiornamento','n'],['titolo','Tipo titolo','t'],['durata','Durata (mesi)','n'],['tipoPU','Tipo (valore/unico)','t']];
const blank=v=>v===''||v==null;
function imDiff(ex,f){const d=[];
 for(const [k,lb,t] of DK){let a=ex[k];const b=f[k];if(k=='prata'&&blank(a))a=ex.importo;
  if(t=='n'){const A=blank(a)?0:+a;if(Math.abs(A-(+b||0))>.005)d.push([lb,blank(a)?'—':E2(A),E2(b)])}
  else{const A=k=='data'?String(a||'').slice(0,10):a;if(nz(A)!=nz(b))d.push([lb,blank(A)?'—':String(A),String(b||'—')])}}
 return d}
function imBuild(rows){const used=new Set(),pairs=[],byN={},sd=p=>String(p.data).slice(0,10);
 S.pol.forEach(p=>{(byN[nn(p.polizza)]=byN[nn(p.polizza)]||[]).push(p)});
 const cand=r=>(byN[nn(r.polizza)]||[]).filter(p=>p.tipo==r.tipo&&!used.has(p.id));
 const l1=[],l2=[],l3=[],grp={};
 rows.forEach(r=>{const m=cand(r).find(p=>sd(p)==r.data&&Math.abs(N(p.importo)-r.importo)<.005);if(m){used.add(m.id);pairs.push({r,ex:m})}else l1.push(r)});
 l1.forEach(r=>{const m=cand(r).find(p=>sd(p)==r.data);if(m){used.add(m.id);pairs.push({r,ex:m})}else l2.push(r)});
 l2.forEach(r=>{(grp[r.tipo+nn(r.polizza)]=grp[r.tipo+nn(r.polizza)]||[]).push(r)});
 Object.values(grp).forEach(g=>{const c=cand(g[0]);if(g.length==1&&c.length==1){used.add(c[0].id);pairs.push({r:g[0],ex:c[0]})}else l3.push(...g)});
 l3.forEach(r=>pairs.push({r,ex:null}));
 return pairs.sort((a,b)=>a.r._i-b.r._i).map(x=>{
  const pr=S.prod.find(p=>p.tipo==x.r.tipo&&nz(p.nome)==nz(x.r.prodotto))||null,f=imFields(x.r,pr),w=[];
  if(pr&&x.r.mol&&Math.abs(N(pr.pond)-x.r.mol)>1e-9)w.push('moltiplicatore del tuo prodotto ×'+pr.pond+', nel file ×'+x.r.mol);
  if(!x.ex)return{k:'new',r:x.r,f,pr,w,sel:true};
  const d=imDiff(x.ex,f);return{k:d.length?'chg':'same',r:x.r,f,pr,w,ex:x.ex,d,sel:false}})}
// --- schermate ---
function imStart(){IM={};lst()}
function imX(){IM=null;lst()}
async function imRead(fl){if(!fl||!fl.length)return;IM={busy:1};lst();
 const rows=[],info=[],errs=[],names=[],seen={};let bim='';
 for(let fi=0;fi<fl.length;fi++){const f=fl[fi];names.push(f.name);
  try{const sh=await readXlsx(await f.arrayBuffer());let got=0;
   for(const s of sh){const p=repParse(s);if(!p)continue;got++;info.push(p);errs.push(...p.errs);bim=bim||p.bim;
    p.rows.forEach(r=>{const k=[r.tipo,nn(r.polizza),r.data,r.importo,r.prata,r.isP,r.isR].join('|');if(seen[k]!=null&&seen[k]!=fi)return;seen[k]=fi;r._i=rows.length;r.rep=p.bim?'Bim. '+p.bim:'';rows.push(r)})}
   if(!got)errs.push('"'+f.name+'": nessun foglio riconosciuto (servono "Dettaglio polizze Vita" e/o "Dettaglio polizze Danni")')}
  catch(e){errs.push('"'+f.name+'": '+(e&&e.message||e))}}
 if(!rows.length){IM={err:errs.length?errs:['Nessuna polizza trovata nel file']};lst();return}
 const items=imBuild(rows),np={};
 items.forEach(it=>{if(!it.pr){const k=it.r.tipo+'|'+nz(it.r.prodotto);(np[k]=np[k]||{nome:it.r.prodotto,tipo:it.r.tipo,pond:it.r.mol||(it.r.tipo=='D'?3:1),inv:it.f.inv,n:0,sel:true}).n++}});
 const y=I().anno;
 IM={names,bim,info,errs,items,prods:Object.values(np),yw:rows.filter(r=>+r.data.slice(0,4)!=y).length};lst()}
function imT(i){IM.items[i].sel=!IM.items[i].sel;imC()}
function imAll(k,v){IM.items.forEach(x=>{if(x.k==k)x.sel=!!v});lst()}
function imC(){const b=$('#im_go');if(b)b.textContent='Importa '+IM.items.filter(x=>x.sel).length+' polizze'}
function imH(){
 if(IM.busy)return'<div class="card"><p>Lettura del file in corso…</p></div>';
 const pick=`<div class="card"><h2>Importa da Excel</h2><p style="color:var(--m);font-size:13px">Scegli il file estratto con i fogli "Dettaglio polizze Vita" e "Dettaglio polizze Danni" (anche due file insieme). Non viene salvato nulla finché non confermi.</p><input type="file" accept=".xlsx,.xlsm,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" multiple onchange="imRead(this.files)"><button class="s" onclick="imX()">Annulla</button></div>`;
 if(!IM.items)return(IM.err?`<div class="warn">${IM.err.map(e=>h(e)).join('<br>')}</div>`:'')+pick;
 const it=IM.items,K=k=>it.filter(x=>x.k==k).length,nS=it.filter(x=>x.sel).length,sm=(x,i)=>`<label class="ck"><input type="checkbox" ${x.sel?'checked':''} onchange="imT(${i})"><span style="flex:1;min-width:0"><b>${h(x.r.cliente)}</b> · ${h(x.r.polizza)}<small style="display:block;color:var(--m)">${x.r.data} · ${x.r.tipo=='V'?'Vita':'Danni'} · ${h(x.r.prodotto)}${x.r.titolo?' · '+h(x.r.titolo):''}</small>${(x.d||[]).map(d=>`<small style="display:block">${h(d[0])}: ${h(d[1])} → <b>${h(d[2])}</b></small>`).join('')}${x.w.map(w=>`<small style="display:block;color:var(--r)">⚠ ${h(w)}</small>`).join('')}</span><span style="text-align:right;white-space:nowrap"><b>${E2(x.f.isP)}</b><small style="display:block;color:var(--m)">rata ${E2(x.f.isR+x.f.incNC+x.f.maggAgg)}</small></span></label>`;
 const list=k=>it.map((x,i)=>x.k==k?sm(x,i):'').join('');
 return`<div class="card"><h2>Anteprima importazione</h2>
 <div class="row"><span>File</span><b style="text-align:right">${IM.names.map(n=>h(n)).join('<br>')}</b></div>
 ${IM.bim?`<div class="row"><span>Bimestre</span><b>${h(IM.bim)}</b></div>`:''}
 <div class="row"><span>Nuove polizze</span><b>${K('new')}</b></div>
 <div class="row"><span>Già presenti, con differenze</span><b>${K('chg')}</b></div>
 <div class="row"><span>Già presenti, uguali</span><b>${K('same')}</b></div>
 ${IM.info.map(p=>`<div style="padding:8px 0;border-top:1px solid var(--l);font-size:13px"><b>${p.tipo=='V'?'Vita':'Danni'}</b>: ${p.rows.length} polizze · IS produzione ${E2(p.sum.isp)} · IS di rata ${E2(p.sum.isr+p.sum.inc+p.sum.agg)}<br><span style="color:${p.bad.length?'var(--r)':'var(--m)'}">${!p.tot?'Totale del file non trovato':p.bad.length?'⚠ Non coincide con il totale del file: controlla il file':'✓ Coincide con il totale del file'}</span></div>`).join('')}</div>
 ${IM.errs.length?`<div class="warn">${IM.errs.slice(0,6).map(e=>h(e)).join('<br>')}${IM.errs.length>6?'<br>…':''}</div>`:''}
 ${IM.yw?`<div class="warn">${IM.yw} polizze hanno un anno diverso da quello impostato (${I().anno}): non compaiono nel riepilogo finché non cambi anno in Impostazioni.</div>`:''}
 ${IM.prods.length?`<div class="card"><h2>Prodotti non presenti nel tuo elenco</h2><p style="color:var(--m);font-size:13px">Se li crei vengono aggiunti alla scheda Prodotti con il moltiplicatore del file; potrai modificarli.</p>${IM.prods.map((p,i)=>`<label class="ck"><input type="checkbox" ${p.sel?'checked':''} onchange="IM.prods[${i}].sel=this.checked"><span style="flex:1"><b>${h(p.nome)}</b><small style="display:block;color:var(--m)">${p.tipo=='V'?'Vita':'Danni'} · ×${p.pond}${p.tipo=='V'&&p.inv?' · investimento':''} · ${p.n} polizze</small></span></label>`).join('')}</div>`:''}
 ${K('chg')?`<div class="card"><h2>Polizze con differenze</h2><p style="color:var(--m);font-size:13px">Spunta quelle da aggiornare con i dati del file. Le altre restano com'erano.</p><div class="seg"><button class="s" onclick="imAll('chg',1)">Aggiorna tutte</button><button class="s" onclick="imAll('chg',0)">Nessuna</button></div>${list('chg')}</div>`:''}
 ${K('new')?`<div class="card"><h2>Nuove polizze</h2><div class="seg"><button class="s" onclick="imAll('new',1)">Tutte</button><button class="s" onclick="imAll('new',0)">Nessuna</button></div>${list('new')}</div>`:''}
 ${K('same')?`<details class="card"><summary>${K('same')} polizze già presenti e uguali</summary>${it.map((x,i)=>x.k=='same'?`<div class="row"><span>${h(x.r.cliente)} · ${h(x.r.polizza)}</span><b>${E2(x.f.isP)}</b></div>`:'').join('')}</details>`:''}
 <div style="position:sticky;bottom:calc(58px + env(safe-area-inset-bottom));padding:10px 0 2px;background:linear-gradient(rgba(250,248,245,0),var(--c) 35%);z-index:2"><button id="im_go" onclick="imGo()" style="margin:0">Importa ${nS} polizze</button></div><button class="s" onclick="imX()">Annulla</button>`}
function imGo(){if(!IM||!IM.items)return;const sel=IM.items.filter(x=>x.sel);if(!sel.length){toast('Nessuna polizza selezionata',1);return}
 const need=new Set(sel.filter(x=>!x.pr).map(x=>x.r.tipo+'|'+nz(x.r.prodotto))),mk=IM.prods.filter(p=>p.sel&&need.has(p.tipo+'|'+nz(p.nome)));
 if(mk.length){mk.forEach(p=>S.prod.push({nome:p.nome,tipo:p.tipo,pond:p.pond,inv:p.inv,cat:p.tipo=='V'?((VC.find(c=>c[1]==+p.pond&&c[2]==+p.inv)||[''])[0]):'',plafP:'',plafR:'',rid:''}));keep();enq('saveProdotti',[S.prod],'prod')}
 const L=sel.map(x=>x.ex?{...x.ex,...x.f}:{id:uid(),...x.f,sost:0,magg:0,plafP:'',plafR:'',rid:(x.pr&&x.pr.rid)||''});
 IM.items.filter(x=>x.k=='same'&&!x.sel&&x.ex&&!isImp(x.ex)).forEach(x=>L.push({...x.ex,src:'imp',rep:x.f.rep||x.ex.rep||''}));
 L.forEach(o=>{const i=S.pol.findIndex(p=>p.id==o.id);i<0?S.pol.push(o):S.pol[i]=o});
 const t=Date.now();for(let i=0;i<L.length;i+=40)enq('savePolizzeBatch',[L.slice(i,i+40)],'imp'+t+'_'+i);
 const nN=sel.filter(x=>!x.ex).length,bm=/^\d{2}\.(\d{2})\.(\d{4})$/.exec(IM.bim||'');if(bm&&+bm[2]==I().anno)selM=+bm[1]-1;IM=null;render();toast('Importate '+nN+' nuove, aggiornate '+(sel.length-nN)+' ✓')}

function setup(msg){show(0);$('#v0').innerHTML=`<div class="card"><h2>Collega Rappel</h2>${msg?`<div class="warn">${h(msg)}</div>`:''}<p style="color:var(--m);font-size:13px">Incolla il link dell'app web di Apps Script (finisce con /exec) e la chiave scelta in Code.gs.</p><label>Link /exec</label><input id="c_u" value="${h(CFG().u)}"><label>Chiave</label><input id="c_k" type="password" value="${h(CFG().k)}"><button onclick="cn()">Collega</button></div>`}
function cn(){const nu=$('#c_u').value.trim();if(nu!==localStorage.rpU){delete localStorage.rpCache;delete localStorage.rpProd;OPS=[];sv_()}localStorage.rpU=$('#c_u').value.trim();localStorage.rpK=$('#c_k').value.trim();start()}

 (OPS.length?flush():Promise.resolve()).then(()=>api('getAll')).then(r=>{try{set(r,true)}catch(e){setup('Connessione riuscita, ma errore nella visualizzazione: '+(e&&e.message||e))}},
  e=>{const m=String(e&&e.message||e);if(C&&!/chiave|configurato/i.test(m))toast('Offline: mostro gli ultimi dati salvati sul telefono',1);else setup('Errore di connessione: '+m+'. Controlla link e chiave.')})}
if('serviceWorker' in navigator){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.register('sw.js').catch(()=>{});navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had)toast('Nuova versione pronta: chiudi e riapri l\'app')})}
